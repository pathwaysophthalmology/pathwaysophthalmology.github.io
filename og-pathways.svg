<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Pathways: eye movements, visual pathways and pupils</title>
  <rect width="1200" height="630" fill="#0c1226"/>
  <rect x="28" y="28" width="1144" height="574" rx="22" fill="none" stroke="#2c3765" stroke-width="2"/>

  <!-- Brand -->
  <g transform="translate(88 92)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#d4f03a" stroke-width="3"/>
    <circle cx="20" cy="20" r="6" fill="#d4f03a"/>
  </g>

  <text x="86" y="292" fill="#e9edfb" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" font-size="128" letter-spacing="-2">Pathways</text>
  <text x="90" y="356" fill="#e9edfb" font-family="'Instrument Sans Variable', 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600">Eye movements, visual pathways and pupils</text>
  <text x="90" y="408" fill="#a3add3" font-family="'Instrument Sans Variable', 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26">An interactive neuro-ophthalmology course</text>
  <text x="90" y="444" fill="#a3add3" font-family="'Instrument Sans Variable', 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26">for finals and the UKMLA</text>

  <!-- Two eyes: a right third nerve palsy, down and out with ptosis and a dilated pupil -->
  <g transform="translate(760 150)">
    <g>
      <clipPath id="ar"><path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z"/></clipPath>
      <g clip-path="url(#ar)">
        <path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z" fill="#e9edfb"/>
        <circle cx="58" cy="114" r="34" fill="#6ea8ff"/>
        <circle cx="58" cy="114" r="20" fill="#0c1226"/>
        <path d="M -10 -80 L -10 100 L 0 100 Q 80 18 160 100 L 170 100 L 170 -80 Z" fill="#151d3b" stroke="#a3add3" stroke-width="3" transform="translate(0 62)"/>
      </g>
      <path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z" fill="none" stroke="#a3add3" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="translate(220 0)">
      <clipPath id="al"><path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z"/></clipPath>
      <g clip-path="url(#al)">
        <path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z" fill="#e9edfb"/>
        <circle cx="80" cy="100" r="34" fill="#6ea8ff"/>
        <circle cx="80" cy="100" r="12" fill="#0c1226"/>
        <path d="M -10 -80 L -10 100 L 0 100 Q 80 18 160 100 L 170 100 L 170 -80 Z" fill="#151d3b" stroke="#a3add3" stroke-width="3" transform="translate(0 6)"/>
      </g>
      <path d="M 0 100 Q 80 18 160 100 Q 80 172 0 100 Z" fill="none" stroke="#a3add3" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Visual fields: bitemporal hemianopia -->
  <defs>
    <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a3add3" stroke-width="2"/>
    </pattern>
  </defs>
  <g transform="translate(840 440)">
    <circle cx="0" cy="0" r="64" fill="#e9edfb"/>
    <path d="M 0 0 L 0 -64 A 64 64 0 0 0 0 64 Z" fill="#0c1226"/>
    <path d="M 0 0 L 0 -64 A 64 64 0 0 0 0 64 Z" fill="url(#h)"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#a3add3" stroke-dasharray="4 4"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#a3add3" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#a3add3" stroke-width="3"/>
  </g>
  <g transform="translate(1060 440)">
    <circle cx="0" cy="0" r="64" fill="#e9edfb"/>
    <path d="M 0 0 L 0 -64 A 64 64 0 0 1 0 64 Z" fill="#0c1226"/>
    <path d="M 0 0 L 0 -64 A 64 64 0 0 1 0 64 Z" fill="url(#h)"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#a3add3" stroke-dasharray="4 4"/>
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#a3add3" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#a3add3" stroke-width="3"/>
  </g>

  <rect x="90" y="500" width="180" height="4" rx="2" fill="#d4f03a"/>
  <text x="90" y="548" fill="#a3add3" font-family="'Instrument Sans Variable', 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22">Cases, OSCE walkthroughs and a certificate</text>
</svg>
